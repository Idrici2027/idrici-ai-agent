name: Build Idrici AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project structure
        run: flutter create --platforms=android --project-name idrici_ai build_app

      - name: Copy Idrici AI application files
        run: |
          cp android_app/pubspec.yaml build_app/pubspec.yaml
          rm -rf build_app/lib
          cp -r android_app/lib build_app/lib
          cp -r android_app/assets build_app/assets
          # The default test generated by `flutter create` refers to a
          # widget that does not exist in this app.
          rm -rf build_app/test

      - name: Generate app icon
        run: |
          python3 -m pip install --quiet --break-system-packages pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          # android_app/app_icon.png is a square PNG with transparent
          # rounded corners. It is resized for every screen density.
          source = Image.open("android_app/app_icon.png").convert("RGBA")
          res = Path("build_app/android/app/src/main/res")

          densities = {
              "mdpi": 48, "hdpi": 72, "xhdpi": 96,
              "xxhdpi": 144, "xxxhdpi": 192,
          }
          for name, size in densities.items():
              folder = res / f"mipmap-{name}"
              folder.mkdir(parents=True, exist_ok=True)

              # Classic icon (Android 7 and older).
              source.resize((size, size), Image.LANCZOS).save(
                  folder / "ic_launcher.png"
              )

              # Adaptive icon (Android 8+): 108dp canvas with the tile
              # kept inside the 72dp safe zone so it is never cropped.
              canvas = round(size * 108 / 48)
              inner = round(canvas * 0.66)
              tile = source.resize((inner, inner), Image.LANCZOS)
              layer = Image.new("RGBA", (canvas, canvas), (0, 0, 0, 0))
              offset = (canvas - inner) // 2
              layer.paste(tile, (offset, offset), tile)
              layer.save(folder / "ic_launcher_foreground.png")

          adaptive = res / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          (adaptive / "ic_launcher.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android='
              '"http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@android:color/transparent"/>\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          print("icon generated")
          PY

      - name: Add Android permissions and speech services
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "build_app/android/app/src/main/AndroidManifest.xml"
          )
          content = manifest.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.RECORD_AUDIO",
              "android.permission.MODIFY_AUDIO_SETTINGS",
              # selfie camera, so the avatar can follow your hand and face
              "android.permission.CAMERA",
          ]
          missing = [p for p in permissions if p not in content]
          lines = "".join(
              f'    <uses-permission android:name="{p}"/>\n'
              for p in missing
          )
          # The camera is optional: the app still installs on devices
          # without one.
          if 'android.hardware.camera"' not in content:
              lines += (
                  '    <uses-feature android:name="android.hardware.camera"'
                  ' android:required="false"/>\n'
              )
          if lines:
              content = content.replace(
                  "<application", lines + "    <application", 1
              )

          # Android 11+ must declare which services the app talks to,
          # otherwise speech recognition and text-to-speech are invisible.
          intents = ""
          if "android.speech.RecognitionService" not in content:
              intents += (
                  '        <intent>\n'
                  '            <action android:name="android.speech.RecognitionService"/>\n'
                  '        </intent>\n'
              )
          if "android.intent.action.TTS_SERVICE" not in content:
              intents += (
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.TTS_SERVICE"/>\n'
                  '        </intent>\n'
              )

          if intents:
              if "<queries>" in content:
                  content = content.replace(
                      "<queries>", "<queries>\n" + intents, 1
                  )
              else:
                  content = content.replace(
                      "<application",
                      "    <queries>\n" + intents + "    </queries>\n    <application",
                      1,
                  )

          manifest.write_text(content)
          print(content)
          PY

      - name: Get Flutter dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Analyze Dart code (informational)
        working-directory: build_app
        continue-on-error: true
        run: flutter analyze

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Idrici-AI-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
