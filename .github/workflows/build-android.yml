name: Build Idrici AI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project structure
        run: flutter create --platforms=android --project-name idrici_ai build_app

      - name: Copy Idrici AI application files
        run: |
          cp android_app/pubspec.yaml build_app/pubspec.yaml
          mkdir -p build_app/lib
          cp android_app/lib/main.dart build_app/lib/main.dart

      - name: Get Flutter dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build release APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Idrici-AI-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
