name: Idrici AI Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.0,<9.0" "pytest-asyncio>=0.24,<2.0" "fastapi>=0.115,<1.0" "uvicorn[standard]>=0.30,<1.0" "pydantic>=2.8,<3.0" "httpx>=0.27,<1.0"

      - name: Run tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -v
