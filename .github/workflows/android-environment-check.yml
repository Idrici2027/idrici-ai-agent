
name: Idrici AI Android Environment Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Inspect Flutter and Java
        run: |
          flutter --version
          dart --version
          java -version

      - name: Inspect real Idrici dependencies
        run: |
          echo "===== IDRICI PUBSPEC ====="
          cat android_app/pubspec.yaml

          echo "===== CAMERA VERSION ====="
          grep -n "camera:" android_app/pubspec.yaml || true

      - name: Generate temporary Android scaffold
        run: |
          flutter create --platforms=android \
            --project-name idrici_ai diagnostic_app

          cp android_app/pubspec.yaml diagnostic_app/pubspec.yaml
          cd diagnostic_app
          flutter pub get

      - name: Inspect Android toolchain
        working-directory: diagnostic_app/android
        run: |
          echo "===== GRADLE ====="
          cat gradle/wrapper/gradle-wrapper.properties

          echo "===== ANDROID GRADLE PLUGIN ====="
          grep -nE 'com.android.application|com.android.tools.build:gradle' \
            settings.gradle* build.gradle* app/build.gradle* || true

          echo "===== KOTLIN ====="
          grep -nE 'org.jetbrains.kotlin.android|kotlin_version' \
            settings.gradle* build.gradle* app/build.gradle* || true

          echo "===== ANDROID SDK CONFIG ====="
          grep -nE 'minSdk|compileSdk|targetSdk' \
            app/build.gradle* || true

      - name: Finish diagnostics
        run: echo "Idrici AI diagnostic completed successfully."
