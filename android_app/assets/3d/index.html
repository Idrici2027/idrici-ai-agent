<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Idrici AI Hologram</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#030611;color:#dffaff;font-family:Arial,sans-serif
}
#stage{position:fixed;inset:0}
#hud{
 position:fixed;inset:0;pointer-events:none;
 display:flex;flex-direction:column;
 justify-content:space-between;padding:18px
}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{font-size:13px;letter-spacing:3px;color:#9cefff}
.status{
 font-size:11px;color:#9cefff;border:1px solid #2b91ad88;
 border-radius:20px;padding:7px 11px;background:#06132299
}
#reply{
 align-self:center;max-width:88%;margin-bottom:9vh;
 padding:10px 16px;border:1px solid #42dafa66;
 border-radius:14px;background:#061322aa;color:#e9fbff;
 text-align:center;font-size:14px;opacity:0;
 transition:opacity .25s;box-shadow:0 0 22px #00cfff22
}
#hint{font-size:10px;color:#6aa6b8;text-align:center;letter-spacing:1px}
#video{position:fixed;width:1px;height:1px;opacity:.001}
</style>
</head>

<body>
<div id="stage"></div>
<video id="video" autoplay playsinline muted></video>

<div id="hud">
 <div class="top">
  <div class="brand">IDRICI AI</div>
  <div id="status" class="status">HOLOGRAM • READY</div>
 </div>
 <div id="reply"></div>
 <div id="hint">HAND TRACKING • VOICE INTERFACE</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.js" crossorigin="anonymous"></script>

<script>
(() => {
const root=document.getElementById('stage');
const status=document.getElementById('status');

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);
camera.position.set(0,1.1,7.5);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x000000,0);
root.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x8bbcff,1.7));

const key=new THREE.PointLight(0x42dfff,3,12);
key.position.set(2,3,4);
scene.add(key);

const violet=new THREE.PointLight(0x9b42ff,2,10);
violet.position.set(-2,1,2);
scene.add(violet);

const human=new THREE.Group();
scene.add(human);

const cyan=new THREE.MeshBasicMaterial({
 color:0x55eaff,wireframe:true,transparent:true,opacity:.42
});

const glow=new THREE.MeshBasicMaterial({
 color:0x9c6bff,transparent:true,opacity:.22
});

const solid=new THREE.MeshPhongMaterial({
 color:0x183e75,emissive:0x164b9c,
 emissiveIntensity:1.1,transparent:true,
 opacity:.30,shininess:90
});

function orb(parent,x,y,z,sx,sy,sz,mat){
 const m=new THREE.Mesh(
  new THREE.SphereGeometry(1,24,18),mat
 );
 m.position.set(x,y,z);
 m.scale.set(sx,sy,sz);
 parent.add(m);
 return m;
}

// الجسم
orb(human,0,0,0,.68,.98,.34,solid);
orb(human,0,0,0,.70,1,.36,cyan);
orb(human,0,1.02,0,.19,.28,.18,glow);

// الرأس
const headPivot=new THREE.Group();
headPivot.position.set(0,1.42,0);
human.add(headPivot);

orb(headPivot,0,.22,0,.43,.55,.38,solid);
orb(headPivot,0,.22,0,.44,.56,.39,cyan);

// خطوط الوجه الضوئية
for(let i=0;i<5;i++){
 const line=new THREE.Mesh(
  new THREE.BoxGeometry(.48-i*.035,.012,.012),
  new THREE.MeshBasicMaterial({
   color:0x75eaff,transparent:true,opacity:.55
  })
 );
 line.position.set(0,.42-i*.13,.36);
 headPivot.add(line);
}

// الذراعان
const arms=[];

for(const side of [-1,1]){
 const pivot=new THREE.Group();
 pivot.position.set(side*.67,.72,0);
 human.add(pivot);

 orb(pivot,side*.22,-.38,0,.20,.52,.20,solid);
 orb(pivot,side*.22,-.38,0,.205,.53,.205,cyan);
 orb(pivot,side*.22,-.78,0,.16,.16,.16,glow);
 orb(pivot,side*.22,-1.08,0,.14,.38,.14,cyan);
 orb(pivot,side*.22,-1.42,.02,.17,.18,.12,glow);

 arms.push({pivot,side});
}

// الشعر الطويل المتدفق
const hairMat=new THREE.LineBasicMaterial({
 color:0x9d74ff,transparent:true,opacity:.75
});

for(let i=0;i<17;i++){
 const pts=[];
 const x=-.36+i*.045;

 for(let j=0;j<=18;j++){
  const t=j/18;
  pts.push(new THREE.Vector3(
   x+Math.sin(t*5+i*.4)*(.035+t*.10),
   .68-t*1.65,
   -.12+Math.sin(t*3+i)*.04
  ));
 }

 const curve=new THREE.CatmullRomCurve3(pts);

 human.add(new THREE.Line(
  new THREE.BufferGeometry().setFromPoints(curve.getPoints(32)),
  hairMat
 ));
}

// جسيمات الطاقة
const particles=new THREE.Group();
scene.add(particles);

for(let i=0;i<90;i++){
 const p=orb(
  particles,
  (Math.random()-.5)*3,
  (Math.random()-.5)*4.2,
  (Math.random()-.5)*1.1,
  .012,.012,.012,
  new THREE.MeshBasicMaterial({
   color:i%3?0x38dfff:0xb46aff
  })
 );

 p.userData={
  phase:Math.random()*6.28,
  baseY:p.position.y
 };
}

// شرارات الكهرباء
const sparks=new THREE.Group();
scene.add(sparks);

function burst(){
 sparks.clear();

 for(let i=0;i<34;i++){
  const points=[new THREE.Vector3(0,0,0)];
  let x=0,y=0,z=0;

  for(let j=0;j<4;j++){
   x+=(Math.random()-.5)*.32;
   y+=(Math.random()-.5)*.32;
   z+=(Math.random()-.5)*.22;
   points.push(new THREE.Vector3(x,y,z));
  }

  const material=new THREE.LineBasicMaterial({
   color:i%2?0x65efff:0xc18aff,
   transparent:true,opacity:1
  });

  const line=new THREE.Line(
   new THREE.BufferGeometry().setFromPoints(points),
   material
  );

  line.position.set(
   (Math.random()-.5)*1.1,
   (Math.random()-.5)*2.5,
   (Math.random()-.5)*.5
  );

  sparks.add(line);
 }

 sparks.userData.until=performance.now()+650;
}

let handX=0;
let handY=0;
let lastPinch=0;
let vision=null;
let lastVideoTime=-1;

const video=document.getElementById('video');

// تشغيل الكاميرا وتتبع اليد
async function startHands(){
 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw new Error('Camera API unavailable');
  }

  const stream=await navigator.mediaDevices.getUserMedia({
   video:{
    facingMode:'user',
    width:640,
    height:480
   },
   audio:false
  });

  video.srcObject=stream;
  await video.play();

  const visionFiles=await FilesetResolver.forVisionTasks(
   'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
  );

  vision=await HandLandmarker.createFromOptions(
   visionFiles,
   {
    baseOptions:{
     modelAssetPath:
     'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
     delegate:'GPU'
    },
    runningMode:'VIDEO',
    numHands:1
   }
  );

  status.textContent='CAMERA • TRACKING';
  track();

 }catch(e){
  status.textContent='HOLOGRAM • CAMERA OFF';
  console.warn('Hand tracking unavailable:',e);
 }
}

function track(){
 if(
  vision &&
  video.readyState>=2 &&
  video.currentTime!==lastVideoTime
 ){
  lastVideoTime=video.currentTime;

  const result=vision.detectForVideo(
   video,performance.now()
  );

  if(result.landmarks?.length){
   const lm=result.landmarks[0];
   const index=lm[8];
   const thumb=lm[4];

   handX=(.5-index.x)*2.2;
   handY=(.5-index.y)*2.0;

   // تقريب إشارة ضم الإبهام والسبابة
   const pinch=Math.hypot(
    index.x-thumb.x,
    index.y-thumb.y
   );

   const now=performance.now();

   if(pinch<.035 && now-lastPinch>1100){
    burst();
    lastPinch=now;
   }
  }
 }

 requestAnimationFrame(track);
}

// الحركة المستمرة
const clock=new THREE.Clock();

function animate(){
 requestAnimationFrame(animate);

 const t=clock.getElapsedTime();

 human.position.y=Math.sin(t*1.25)*.045;

 human.rotation.y=
  Math.sin(t*.55)*.10+handX*.16;

 human.rotation.x=THREE.MathUtils.lerp(
  human.rotation.x,handY*.10,.035
 );

 headPivot.rotation.y=THREE.MathUtils.lerp(
  headPivot.rotation.y,handX*.42,.055
 );

 headPivot.rotation.x=THREE.MathUtils.lerp(
  headPivot.rotation.x,
  -handY*.20+Math.sin(t*.8)*.025,
  .05
 );

 arms.forEach(a=>{
  a.pivot.rotation.z=THREE.MathUtils.lerp(
   a.pivot.rotation.z,
   a.side===1?-.10+handX*.12:.10+handX*.12,
   .025
  );
 });

 particles.children.forEach(p=>{
  p.position.y=
   p.userData.baseY+
   Math.sin(t*1.4+p.userData.phase)*.12;

  p.rotation.y=t*.2;
 });

 if(performance.now()>(sparks.userData.until||0)){
  sparks.clear();
 }

 renderer.render(scene,camera);
}

animate();
startHands();

// تغيير حجم الشاشة
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

// الربط مع Flutter
window.Idrici3D={
 showReply(text){
  const el=document.getElementById('reply');
  el.textContent=String(text??'');
  el.style.opacity='1';
 },

 clearReply(){
  document.getElementById('reply').style.opacity='0';
 },

 setSpeaking(value){
  human.scale.y=value?1.015:1;
 },

 triggerSnap:burst
};

})();
</script>
</body>
</html>
