
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idrici AI - Electric Being</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #02040c;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#label {
  position: fixed;
  top: 22px;
  width: 100%;
  text-align: center;
  color: #b8efff;
  font-size: 18px;
  letter-spacing: 6px;
  text-shadow: 0 0 18px #00aaff;
  pointer-events: none;
  z-index: 2;
}

#status {
  position: fixed;
  bottom: 75px;
  width: 100%;
  text-align: center;
  color: #7ddfff;
  font-size: 11px;
  letter-spacing: 2px;
  pointer-events: none;
  z-index: 2;
}

#sound {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 24px;
  border: 1px solid #36cfff;
  border-radius: 30px;
  background: #071a2b;
  color: #b8efff;
  font-size: 13px;
  box-shadow: 0 0 18px #0088cc66;
  z-index: 3;
}

/* Floating reply: transparent text, no background */
#reply-layer {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  pointer-events: none;
  z-index: 5;
  overflow: hidden;
}

#reply-text {
  max-width: 88%;
  max-height: 55%;
  overflow: hidden;
  color: #e5faff;
  font-size: clamp(15px, 3.5vw, 23px);
  line-height: 1.65;
  font-weight: 600;
  text-align: center;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  direction: auto;
  text-shadow:
    0 0 5px #ffffff,
    0 0 12px #35cfff,
    0 0 25px #008cff,
    0 0 42px #008cff;
  opacity: 0;
  transform: translateY(35px) scale(0.96);
  transition: none;
}

#reply-text.visible {
  animation: replyRise 7s ease-out forwards;
}

@keyframes replyRise {
  0% {
    opacity: 0;
    transform: translateY(35px) scale(0.96);
  }
  10% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  72% {
    opacity: 1;
    transform: translateY(-35px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-90px) scale(0.97);
  }
}
</style>
</head>

<body>

<div id="label">IDRICI AI</div>
<div id="status">ELECTRIC CORE INITIALIZING</div>
<button id="sound">⚡ تفعيل صوت الكهرباء</button>

<div id="reply-layer" aria-live="polite">
  <div id="reply-text"></div>
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02040c);
scene.fog = new THREE.FogExp2(0x02040c, 0.035);

const camera = new THREE.PerspectiveCamera(
  42,
  innerWidth / innerHeight,
  0.1,
  100
);

camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0x17466d, 1.5));

const blueLight = new THREE.PointLight(0x00aaff, 7, 14);
blueLight.position.set(0, 1, 3);
scene.add(blueLight);

const whiteLight = new THREE.PointLight(0xffffff, 3, 10);
whiteLight.position.set(0, -1, 2);
scene.add(whiteLight);

// ENERGY CORE

const energy = new THREE.Group();
scene.add(energy);

const core = new THREE.Mesh(
  new THREE.SphereGeometry(0.52, 48, 48),
  new THREE.MeshBasicMaterial({
    color: 0x8cecff,
    wireframe: true
  })
);

energy.add(core);

const innerCore = new THREE.Mesh(
  new THREE.SphereGeometry(0.32, 40, 40),
  new THREE.MeshBasicMaterial({
    color: 0xffffff
  })
);

energy.add(innerCore);

const glow = new THREE.Mesh(
  new THREE.SphereGeometry(0.68, 32, 32),
  new THREE.MeshBasicMaterial({
    color: 0x008cff,
    transparent: true,
    opacity: 0.10,
    side: THREE.BackSide
  })
);

energy.add(glow);

// ELECTRIC PARTICLES

const particleCount = 1400;
const particlePositions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  const angle = Math.random() * Math.PI * 2;
  const radius = 0.6 + Math.random() * 1.5;

  particlePositions[i * 3] = Math.cos(angle) * radius;
  particlePositions[i * 3 + 1] =
    (Math.random() - 0.5) * 3.5;
  particlePositions[i * 3 + 2] =
    Math.sin(angle) * radius;
}

const particleGeometry = new THREE.BufferGeometry();

particleGeometry.setAttribute(
  'position',
  new THREE.BufferAttribute(particlePositions, 3)
);

const particles = new THREE.Points(
  particleGeometry,
  new THREE.PointsMaterial({
    color: 0x5bdfff,
    size: 0.035,
    transparent: true,
    opacity: 0.9,
    blending: THREE.AdditiveBlending
  })
);

scene.add(particles);

// ELECTRIC LIGHTNING

const bolts = [];

function createBolt() {
  const points = [];

  let x = (Math.random() - 0.5) * 1.4;
  let y = (Math.random() - 0.5) * 1.4;
  let z = (Math.random() - 0.5) * 0.8;

  for (let i = 0; i < 13; i++) {
    points.push(new THREE.Vector3(x, y, z));

    x += (Math.random() - 0.5) * 0.42;
    y += (Math.random() - 0.5) * 0.42;
    z += (Math.random() - 0.5) * 0.3;
  }

  const geometry = new THREE.BufferGeometry()
    .setFromPoints(points);

  const material = new THREE.LineBasicMaterial({
    color: Math.random() > 0.5 ? 0x9ceeff : 0xffffff,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending
  });

  const bolt = new THREE.Line(geometry, material);

  scene.add(bolt);

  bolts.push({
    object: bolt,
    life: 0,
    duration: 0.12 + Math.random() * 0.25
  });
}

function updateBolts(delta) {
  for (let i = bolts.length - 1; i >= 0; i--) {
    const bolt = bolts[i];

    bolt.life += delta;

    bolt.object.material.opacity =
      Math.max(0, 1 - bolt.life / bolt.duration);

    if (bolt.life >= bolt.duration) {
      scene.remove(bolt.object);
      bolt.object.geometry.dispose();
      bolt.object.material.dispose();
      bolts.splice(i, 1);
    }
  }

  if (Math.random() < 0.55) {
    createBolt();
  }
}

// ELECTRIC HUMANOID

const humanoid = new THREE.Group();
scene.add(humanoid);

const electricMaterial = new THREE.MeshBasicMaterial({
  color: 0x46cfff,
  wireframe: true,
  transparent: true,
  opacity: 0.85
});

function bodyPart(x, y, z, sx, sy, sz) {
  const mesh = new THREE.Mesh(
    new THREE.IcosahedronGeometry(1, 3),
    electricMaterial
  );

  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);

  humanoid.add(mesh);

  return mesh;
}

// Head, neck and chest

const head = bodyPart(0, 1.5, 0, 0.38, 0.46, 0.32);
const neck = bodyPart(0, 0.96, 0, 0.15, 0.25, 0.15);
const chest = bodyPart(0, 0.12, 0, 0.73, 0.82, 0.34);

// Shoulders and arms

const hands = [];

for (const side of [-1, 1]) {
  const shoulder = bodyPart(
    side * 0.78, 0.52, 0,
    0.32, 0.28, 0.27
  );

  const upperArm = bodyPart(
    side * 1.05, 0.05, 0,
    0.20, 0.48, 0.18
  );

  const forearm = bodyPart(
    side * 1.28, -0.52, 0,
    0.15, 0.42, 0.15
  );

  const hand = bodyPart(
    side * 1.34, -1.0, 0,
    0.20, 0.23, 0.12
  );

  hands.push(hand);

  for (let f = 0; f < 5; f++) {
    const finger = bodyPart(
      side * (1.20 + f * 0.07),
      -1.28 - Math.sin(f * 0.6) * 0.05,
      0,
      0.035,
      0.15,
      0.035
    );

    finger.rotation.z = side * -0.12;
  }
}

// BODY ELECTRIC THREADS

const bodyBolts = [];

function createBodyThread() {
  const points = [];

  const start = new THREE.Vector3(
    (Math.random() - 0.5) * 1.5,
    (Math.random() - 0.5) * 2.6,
    0.15
  );

  let p = start.clone();

  for (let i = 0; i < 9; i++) {
    points.push(p.clone());

    p = p.clone().add(
      new THREE.Vector3(
        (Math.random() - 0.5) * 0.22,
        (Math.random() - 0.5) * 0.3,
        (Math.random() - 0.5) * 0.15
      )
    );
  }

  const line = new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({
      color: 0x8ceeff,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    })
  );

  humanoid.add(line);

  bodyBolts.push(line);
}

for (let i = 0; i < 45; i++) {
  createBodyThread();
}

// REPLY DISPLAY API

const replyElement = document.getElementById('reply-text');
let replyAnimationTimer = null;

function showReply(text) {
  const safeText = String(text ?? '').trim();

  if (!safeText) return;

  replyElement.textContent =
    safeText.length > 650
      ? safeText.substring(0, 650) + '…'
      : safeText;

  // Restart the animation when a new reply arrives.
  replyElement.classList.remove('visible');

  if (replyAnimationTimer) {
    clearTimeout(replyAnimationTimer);
  }

  // Force the browser to restart the CSS animation.
  void replyElement.offsetWidth;

  replyElement.classList.add('visible');

  replyAnimationTimer = setTimeout(() => {
    replyElement.classList.remove('visible');
  }, 7200);
}

function clearReply() {
  if (replyAnimationTimer) {
    clearTimeout(replyAnimationTimer);
  }

  replyElement.classList.remove('visible');
  replyElement.textContent = '';
}

// Public interface called by Flutter WebView.
window.Idrici3D = Object.freeze({
  showReply,
  clearReply
});

// SOUND SYSTEM

let audioContext = null;
let soundEnabled = false;
let soundTimer = null;

function playSpark() {
  if (!audioContext || !soundEnabled) return;

  const now = audioContext.currentTime;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = 'sawtooth';

  oscillator.frequency.setValueAtTime(
    1800 + Math.random() * 1800,
    now
  );

  oscillator.frequency.exponentialRampToValueAtTime(
    250,
    now + 0.09
  );

  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.exponentialRampToValueAtTime(0.045, now + 0.008);
  gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start(now);
  oscillator.stop(now + 0.13);
}

document.getElementById('sound').addEventListener('click', async () => {
  if (!audioContext) {
    audioContext = new (
      window.AudioContext || window.webkitAudioContext
    )();
  }

  await audioContext.resume();

  soundEnabled = !soundEnabled;

  document.getElementById('sound').textContent =
    soundEnabled
      ? '🔊 صوت الكهرباء يعمل'
      : '⚡ تفعيل صوت الكهرباء';

  if (soundTimer) clearInterval(soundTimer);

  if (soundEnabled) {
    playSpark();

    soundTimer = setInterval(() => {
      if (Math.random() > 0.35) playSpark();
    }, 220);
  }
});

// ANIMATION

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.04);
  const t = clock.elapsedTime;

  core.rotation.x += 0.008;
  core.rotation.y += 0.013;

  innerCore.scale.setScalar(
    1 + Math.sin(t * 4) * 0.09
  );

  glow.scale.setScalar(
    1 + Math.sin(t * 3) * 0.12
  );

  particles.rotation.y = t * 0.18;
  particles.rotation.x = Math.sin(t * 0.3) * 0.12;

  energy.position.y = Math.sin(t * 1.7) * 0.10;

  updateBolts(delta);

  // Gradual visual reveal.
  const reveal = Math.min(1, t / 9);
  const smooth = reveal * reveal * (3 - 2 * reveal);

  humanoid.scale.setScalar(smooth);

  humanoid.position.y =
    -0.2 + Math.sin(t * 1.3) * 0.035;

  humanoid.rotation.y =
    Math.sin(t * 0.45) * 0.10;

  head.rotation.y = Math.sin(t * 0.7) * 0.08;
  head.rotation.x = Math.sin(t * 0.9) * 0.035;

  hands.forEach((hand, i) => {
    hand.rotation.z =
      Math.sin(t * 1.5 + i) * 0.08;
  });

  bodyBolts.forEach((line, i) => {
    line.material.opacity =
      0.25 + Math.abs(Math.sin(t * 4 + i)) * 0.7;
  });

  blueLight.intensity =
    5 + Math.sin(t * 5) * 2;

  renderer.render(scene, camera);
}

animate();

// RESIZE

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('status').textContent =
  'IDRICI AI • ELECTRIC LIFE SYSTEM';

</script>
</body>
</html>
