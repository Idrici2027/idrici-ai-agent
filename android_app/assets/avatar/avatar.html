<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Idrici Avatar</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    /* deep violet glow behind the figure */
    background: radial-gradient(ellipse at 50% 46%,
      #2c16b4 0%, #170a64 48%, #07031f 100%);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas#c { display: block; width: 100%; height: 100%; }
  canvas#gl { display: none; }
  body.gl canvas#c { visibility: hidden; }
  body.gl canvas#gl { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #cam { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
  #preview {
    display: none; position: absolute; left: 8px; bottom: 8px; width: 84px; height: 112px;
    border-radius: 14px; border: 1px solid rgba(170,170,255,.3);
    object-fit: cover; transform: scaleX(-1); opacity: .65;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gl"></canvas>
<video id="cam" autoplay playsinline muted></video>
<canvas id="preview"></canvas>
<script>
</script>
</body>
</html>
