<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Idrici Avatar</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #fallback {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: #9fe8d0;
    font: 14px/1.6 sans-serif;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fallback">تعذّر تحميل المجسم ثلاثي الأبعاد.<br>تحقق من اتصال الإنترنت ثم أعد فتح التطبيق.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/*
 * Idrici hologram avatar.
 *
 * Public API (called from Flutter through runJavaScript):
 *   avatar.setState('idle' | 'listening' | 'thinking' | 'speaking')
 *   avatar.setLevel(0..1)   microphone loudness while listening
 *   avatar.lookAt(x, y)     -1..1, x right, y up. Gaze returns to idle
 *                           wandering 2.5 s after the last call.
 */
(function () {
  'use strict';

  var fallback = document.getElementById('fallback');

  function showFallback() { fallback.style.display = 'flex'; }

  if (typeof THREE === 'undefined') { showFallback(); return; }

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({
      canvas: document.getElementById('c'),
      antialias: true,
      alpha: true
    });
  } catch (e) { showFallback(); return; }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 50);
  camera.position.set(0, 0.1, 5.6);

  // ---------- helpers ----------
  var DT = 0.016;
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function damp(a, b, rate) { return a + (b - a) * (1 - Math.exp(-rate * DT)); }

  // ---------- colours (one tint shared by every holographic material) ----------
  var COLORS = {
    idle: 0x54d6b0,
    listening: 0x6ee7ff,
    thinking: 0xffd166,
    speaking: 0x7dffc8
  };
  var tint = new THREE.Color(COLORS.idle);
  var tintTarget = new THREE.Color(COLORS.idle);
  var tinted = [];

  function holoFill(opacity) {
    var m = new THREE.MeshBasicMaterial({
      color: COLORS.idle,
      transparent: true,
      opacity: opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      side: THREE.DoubleSide
    });
    tinted.push(m);
    return m;
  }

  function holoLine(opacity) {
    var m = new THREE.MeshBasicMaterial({
      color: COLORS.idle,
      wireframe: true,
      transparent: true,
      opacity: opacity,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    tinted.push(m);
    return m;
  }

  // ---------- model ----------
  var root = new THREE.Group();
  scene.add(root);

  var head = new THREE.Group();
  root.add(head);

  var skullGeo = new THREE.IcosahedronGeometry(1, 3);
  skullGeo.scale(1, 1.05, 0.95);
  head.add(new THREE.Mesh(skullGeo, holoFill(0.10)));
  head.add(new THREE.Mesh(skullGeo, holoLine(0.35)));

  var eyeGeo = new THREE.SphereGeometry(0.13, 16, 12);
  var eyeL = new THREE.Mesh(eyeGeo, holoFill(1.0));
  var eyeR = new THREE.Mesh(eyeGeo, holoFill(1.0));
  eyeL.position.set(-0.36, 0.14, 0.88);
  eyeR.position.set(0.36, 0.14, 0.88);
  head.add(eyeL);
  head.add(eyeR);

  var mouth = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24), holoFill(0.9));
  mouth.position.set(0, -0.38, 0.9);
  mouth.scale.set(0.24, 0.03, 1);
  head.add(mouth);

  function makeEar(side) {
    var pivot = new THREE.Group();

    var outerGeo = new THREE.ConeGeometry(0.3, 0.95, 4, 1, true);
    outerGeo.translate(0, 0.475, 0);
    var innerGeo = new THREE.ConeGeometry(0.16, 0.6, 4, 1, true);
    innerGeo.translate(0, 0.3, 0.04);

    pivot.add(new THREE.Mesh(outerGeo, holoFill(0.16)));
    pivot.add(new THREE.Mesh(outerGeo, holoLine(0.6)));
    pivot.add(new THREE.Mesh(innerGeo, holoFill(0.45)));

    pivot.position.set(side * 0.62, 0.78, 0);
    pivot.userData.side = side;
    head.add(pivot);
    return pivot;
  }
  var earL = makeEar(-1);
  var earR = makeEar(1);

  // base: light beam, rings, scan line, particles
  var beam = new THREE.Mesh(
    new THREE.ConeGeometry(1.15, 1.6, 32, 1, true),
    holoFill(0.05)
  );
  beam.position.y = -0.65;
  root.add(beam);

  var rings = [];
  var ringArcs = [Math.PI * 1.5, Math.PI * 1.1, Math.PI * 1.8];
  for (var i = 0; i < 3; i++) {
    var radius = 1.15 + i * 0.28;
    var holder = new THREE.Group();
    holder.rotation.x = -Math.PI / 2;
    holder.position.y = -1.45;
    var arc = new THREE.Mesh(
      new THREE.RingGeometry(radius - 0.015, radius + 0.015, 64, 1, 0, ringArcs[i]),
      holoFill(0.6 - i * 0.12)
    );
    holder.add(arc);
    root.add(holder);
    rings.push({ holder: holder, arc: arc, dir: i % 2 === 0 ? 1 : -1 });
  }

  var scan = new THREE.Mesh(new THREE.TorusGeometry(1.02, 0.008, 6, 64), holoFill(0.5));
  scan.rotation.x = Math.PI / 2;
  root.add(scan);

  var PARTICLES = 90;
  var pPos = new Float32Array(PARTICLES * 3);
  var pSpeed = new Float32Array(PARTICLES);
  for (var p = 0; p < PARTICLES; p++) {
    var ang = Math.random() * Math.PI * 2;
    var rad = 0.5 + Math.random() * 0.9;
    pPos[p * 3] = Math.cos(ang) * rad;
    pPos[p * 3 + 1] = -1.5 + Math.random() * 3.2;
    pPos[p * 3 + 2] = Math.sin(ang) * rad;
    pSpeed[p] = 0.15 + Math.random() * 0.35;
  }
  var pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
  var pMat = new THREE.PointsMaterial({
    color: COLORS.idle,
    size: 0.035,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  tinted.push(pMat);
  root.add(new THREE.Points(pGeo, pMat));

  // ---------- state ----------
  var S = {
    state: 'idle',
    level: 0,
    levelSmooth: 0,
    look: { x: 0, y: 0 },
    lookStamp: -1e9,
    lookSmooth: { x: 0, y: 0 },
    eyeOpen: 1,
    blinking: false,
    blinkT: 0,
    blinkAmt: 0,
    nextBlink: 2,
    mouth: 0.03
  };

  window.avatar = {
    ready: true,
    setState: function (name) {
      if (!Object.prototype.hasOwnProperty.call(COLORS, name)) { return; }
      S.state = name;
      tintTarget.setHex(COLORS[name]);
    },
    setLevel: function (v) {
      S.level = clamp(Number(v) || 0, 0, 1);
    },
    lookAt: function (x, y) {
      S.look.x = clamp(Number(x) || 0, -1, 1);
      S.look.y = clamp(Number(y) || 0, -1, 1);
      S.lookStamp = performance.now();
    }
  };

  function onPointer(e) {
    var x = (e.clientX / window.innerWidth) * 2 - 1;
    var y = -((e.clientY / window.innerHeight) * 2 - 1);
    window.avatar.lookAt(x, y);
  }
  window.addEventListener('pointermove', onPointer, { passive: true });
  window.addEventListener('pointerdown', onPointer, { passive: true });

  // ---------- layout ----------
  function resize() {
    var w = Math.max(1, window.innerWidth);
    var h = Math.max(1, window.innerHeight);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // keep the whole model visible on narrow screens
    var halfFov = (camera.fov * Math.PI / 180) / 2;
    camera.position.z = Math.max(5.6, 3.7 / (2 * Math.tan(halfFov) * camera.aspect));
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- animation ----------
  var clock = new THREE.Clock();

  function frame() {
    requestAnimationFrame(frame);

    DT = Math.min(clock.getDelta(), 0.05);
    var t = clock.elapsedTime;

    var isL = S.state === 'listening';
    var isT = S.state === 'thinking';
    var isS = S.state === 'speaking';

    S.level *= 0.94;
    S.levelSmooth = damp(S.levelSmooth, S.level, 12);

    // colour
    tint.lerp(tintTarget, 1 - Math.exp(-6 * DT));
    for (var i = 0; i < tinted.length; i++) { tinted[i].color.copy(tint); }

    // gaze
    var gazeActive = (performance.now() - S.lookStamp) < 2500;
    var gx = gazeActive ? S.look.x : Math.sin(t * 0.4) * 0.25;
    var gy = gazeActive ? S.look.y : Math.sin(t * 0.31 + 1) * 0.1;
    S.lookSmooth.x = damp(S.lookSmooth.x, gx, 6);
    S.lookSmooth.y = damp(S.lookSmooth.y, gy, 6);

    root.position.y = Math.sin(t * 1.4) * 0.04;
    head.rotation.y = S.lookSmooth.x * 0.55;
    head.rotation.x = -S.lookSmooth.y * 0.35;
    head.rotation.z = damp(head.rotation.z, isT ? 0.18 : Math.sin(t * 0.8) * 0.02, 5);

    // ears: perk up when listening, droop when thinking, wiggle when speaking
    var earBase = isL ? 0.05 : (isT ? 0.75 : 0.35);
    var earScaleY = isL ? 1.18 : (isT ? 0.85 : 1.0);
    var earRateX = isS ? 5 : 1.3;
    var earAmp = isS ? 0.06 : 0.03;
    var listenTwitch = isL ? S.levelSmooth * 0.35 : 0;
    var earTargetX = isT ? -0.35 : (isL ? 0.12 : 0);
    var ears = [earL, earR];
    for (var e = 0; e < 2; e++) {
      var ear = ears[e];
      var side = ear.userData.side;
      var twitch = listenTwitch + Math.sin(t * earRateX + e * 1.7) * earAmp;
      ear.rotation.z = damp(ear.rotation.z, -side * (earBase + twitch), 10);
      ear.rotation.x = damp(ear.rotation.x, earTargetX, 8);
      ear.scale.y = damp(ear.scale.y, earScaleY, 8);
    }

    // eyes + blinking
    var eyeTarget = isL ? 1.2 : (isT ? 0.55 : 1.0);
    S.eyeOpen = damp(S.eyeOpen, eyeTarget, 10);
    if (!S.blinking && t >= S.nextBlink) { S.blinking = true; S.blinkT = 0; }
    if (S.blinking) {
      S.blinkT += DT / 0.18;
      if (S.blinkT >= 1) {
        S.blinking = false;
        S.blinkAmt = 0;
        S.nextBlink = t + 2 + Math.random() * 3;
      } else {
        S.blinkAmt = Math.sin(Math.PI * S.blinkT);
      }
    }
    var eyeScaleY = S.eyeOpen * (1 - 0.92 * S.blinkAmt);
    eyeL.scale.set(S.eyeOpen, eyeScaleY, S.eyeOpen);
    eyeR.scale.set(S.eyeOpen, eyeScaleY, S.eyeOpen);

    // mouth (pseudo lip-sync while speaking)
    var mouthTarget = 0.03;
    if (isS) {
      var wave = Math.sin(t * 11) * 0.5 + Math.sin(t * 7.3 + 1.3) * 0.35 +
                 Math.sin(t * 17.1) * 0.15 + 0.35;
      mouthTarget = 0.03 + clamp(wave, 0, 1) * 0.2;
    } else if (isL) {
      mouthTarget = 0.03 + S.levelSmooth * 0.05;
    } else if (isT) {
      mouthTarget = 0.02;
    }
    S.mouth = damp(S.mouth, mouthTarget, 25);
    mouth.scale.y = S.mouth;
    mouth.scale.x = 0.24 - S.mouth * 0.25;

    // base effects
    for (var r = 0; r < rings.length; r++) {
      var ring = rings[r];
      ring.arc.rotation.z += DT * ring.dir * (isT ? 3 : 0.6) * (1 + r * 0.3);
      ring.holder.scale.setScalar(1 + S.levelSmooth * 0.15 + Math.sin(t * 2 + r) * 0.02);
    }
    scan.position.y = -1.0 + ((t * 0.5) % 1) * 2.2;

    var arr = pGeo.attributes.position.array;
    for (var k = 0; k < PARTICLES; k++) {
      arr[k * 3 + 1] += DT * pSpeed[k] * (isT ? 2.2 : 1);
      if (arr[k * 3 + 1] > 1.7) { arr[k * 3 + 1] = -1.5; }
    }
    pGeo.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
  }
  frame();
})();
</script>
</body>
</html>
