<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Idrici Avatar</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    /* deep violet glow behind the figure */
    background: radial-gradient(ellipse at 50% 46%,
      #2c16b4 0%, #170a64 48%, #07031f 100%);
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas#c { display: block; width: 100%; height: 100%; }
  canvas#gl { display: none; }
  body.gl canvas#c { visibility: hidden; }
  body.gl canvas#gl { display: block; position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #cam { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
  #preview {
    display: none; position: absolute; left: 8px; bottom: 8px; width: 84px; height: 112px;
    border-radius: 14px; border: 1px solid rgba(170, 140, 255, 0.55);
    transform: scaleX(-1); opacity: 0.92; pointer-events: none;
  }
  #fallback {
    display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
    padding: 24px; text-align: center; color: #cdbcff; font: 14px/1.6 sans-serif;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gl"></canvas>
<script src="avatar_image.js" onerror="void 0"></script>
<script src="avatar_model.js" onerror="void 0"></script>
<script src="avatar3d.bundle.js" onerror="void 0"></script>
<video id="cam" playsinline muted autoplay></video>
<canvas id="preview" width="168" height="224"></canvas>
<div id="fallback">تعذّر تشغيل المجسم على هذا الجهاز.</div>

<script>
/*
 * Idrici hologram avatar (Canvas 2D: no WebGL, no external libraries).
 * A violet hologram woman with eyes, lips, neck, shoulders and flowing hair.
 * Intro: vortex -> orb -> emblem -> figure.
 *
 * API (called from Flutter):
 *   avatar.setState('idle'|'listening'|'thinking'|'speaking')
 *   avatar.setLevel(0..1)   avatar.lookAt(x, y)   avatar.replay()
 *   avatar.startTracking()  avatar.stopTracking()  avatar.captureFrame()
 */
(function () {
  'use strict';

  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  if (!ctx) { document.getElementById('fallback').style.display = 'flex'; return; }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function ease(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function rng(seed) {
    var s = seed >>> 0;
    return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
  }

  var COLORS = {
    idle: [130, 95, 255],
    listening: [120, 150, 255],
    thinking: [220, 110, 255],
    speaking: [190, 140, 255]
  };
  var tint = COLORS.idle.slice();
  var tintTarget = COLORS.idle.slice();
  var baked = [0, 0, 0];
  var lastBake = 0;

  function rgba(c, a) {
    return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a + ')';
  }
  function coreColor(a) {
    return 'rgba(' + Math.round(lerp(238, tint[0], 0.28)) + ',' + Math.round(lerp(232, tint[1], 0.28)) + ',255,' + a + ')';
  }

  var S = {
    state: 'idle', level: 0, age: 0, t: 0,
    look: { x: 0, y: 0 }, lookStamp: 0, seenStamp: -1e9,
    lx: 0, ly: 0, mouth: 0, blink: 0, nextBlink: 2.5, level_s: 0
  };

  // ---------------------------------------------------------------- layout
  var W = 0, H = 0, dpr = 1, u = 1, ox = 0, oy = 0;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, (typeof GL !== 'undefined' && GL) ? 1.5 : 2);
    var w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    var h = Math.max(1, Math.round(canvas.clientHeight * dpr));
    if (w === W && h === H) { return; }
    W = canvas.width = w; H = canvas.height = h;
    if (typeof GL !== 'undefined' && GL) { GL.size(W, H); }
    u = Math.min(H / 2.6, W / 2.3);
    ox = W / 2; oy = H * 0.66;
  }

  // ---------------------------------------------------------------- 3D model
  // A real 3D hologram: lathe surfaces (head, neck, body) + 3D hair strands,
  // rotated and projected with perspective every frame. Units: head height .85.
  var DC = 4.5;                                   // camera distance
  var LIGHT = (function () { var x = -0.30, y = -0.50, z = 0.81, l = Math.sqrt(x*x+y*y+z*z); return [x/l, y/l, z/l]; })();
  var DARKC = 'rgba(7,3,30,0.97)';

  function sgnPow(v, p) { return (v < 0 ? -1 : 1) * Math.pow(Math.abs(v), p); }
  function cr(a, b, c, d, t) {
    var t2 = t * t, t3 = t2 * t;
    return 0.5 * ((2*b) + (-a + c) * t + (2*a - 5*b + 4*c - d) * t2 + (-a + 3*b - 3*c + d) * t3);
  }
  function prof(tbl, y, k) {
    var n = tbl.length;
    if (y <= tbl[0][0]) { return tbl[0][k]; }
    if (y >= tbl[n - 1][0]) { return tbl[n - 1][k]; }
    var i = 0;
    while (i < n - 2 && y > tbl[i + 1][0]) { i++; }
    var p0 = tbl[Math.max(i - 1, 0)][k], p1 = tbl[i][k], p2 = tbl[i + 1][k], p3 = tbl[Math.min(i + 2, n - 1)][k];
    var t = (y - tbl[i][0]) / (tbl[i + 1][0] - tbl[i][0]);
    return Math.max(0, cr(p0, p1, p2, p3, t));
  }

  // [y, half-width, half-depth]
  var HEAD = [
    [-1.32, 0.000, 0.000], [-1.30, 0.090, 0.110], [-1.24, 0.190, 0.240], [-1.12, 0.260, 0.330],
    [-1.00, 0.285, 0.350], [-0.90, 0.285, 0.340], [-0.80, 0.268, 0.300], [-0.70, 0.235, 0.260],
    [-0.62, 0.195, 0.230], [-0.55, 0.150, 0.200], [-0.50, 0.105, 0.170], [-0.47, 0.060, 0.130],
    [-0.455, 0.000, 0.000]
  ];
  var NECK = [[-0.62, 0.130, 0.115], [-0.45, 0.140, 0.118], [-0.30, 0.160, 0.126]];
  var BODY = [
    [-0.34, 0.16, 0.13], [-0.28, 0.25, 0.15], [-0.20, 0.38, 0.17], [-0.12, 0.51, 0.19],
    [-0.05, 0.60, 0.20], [0.04, 0.66, 0.21], [0.15, 0.69, 0.21], [0.35, 0.70, 0.20],
    [0.65, 0.70, 0.20], [0.95, 0.69, 0.19]
  ];

  function gauss(x, y, cx, cy, sx, sy, amp) {
    var dx = (x - cx) / sx, dy = (y - cy) / sy;
    return amp * Math.exp(-(dx * dx + dy * dy));
  }
  // relief of the face: nose, brows, eye sockets, cheekbones, lips, chin
  function feat(x, y) {
    var ax = Math.abs(x), z = 0;
    z += gauss(ax, y, 0, -0.93, 0.030, 0.045, 0.018);       // nose bridge
    z += gauss(ax, y, 0, -0.85, 0.032, 0.050, 0.030);
    z += gauss(ax, y, 0, -0.768, 0.034, 0.034, 0.060);      // nose tip
    z += gauss(ax, y, 0.040, -0.748, 0.022, 0.022, 0.028);  // nostril wings
    z += gauss(ax, y, 0, -1.00, 0.160, 0.028, 0.026);       // brow ridge
    z += gauss(ax, y, 0.126, -0.90, 0.062, 0.036, -0.024);  // eye sockets
    z += gauss(ax, y, 0.19, -0.78, 0.060, 0.060, 0.020);    // cheekbones
    z += gauss(ax, y, 0, -0.652, 0.070, 0.015, 0.030);      // upper lip
    z += gauss(ax, y, 0, -0.615, 0.065, 0.016, 0.030);      // lower lip
    z += gauss(ax, y, 0, -0.634, 0.095, 0.004, -0.012);     // mouth line
    z += gauss(ax, y, 0, -0.520, 0.070, 0.040, 0.034);      // chin
    return z;
  }
  function headFront(x, y) {
    var a = prof(HEAD, y, 1), b = prof(HEAD, y, 2);
    if (a < 1e-4) { return 0; }
    var r = Math.min(0.985, Math.abs(x) / a);
    return b * Math.sqrt(1 - r * r) + feat(x, y);
  }
  function bodyFront(x, y) {
    var a = prof(BODY, y, 1), b = prof(BODY, y, 2);
    if (a < 1e-4 || Math.abs(x) >= a) { return 0; }
    return b * Math.pow(Math.max(0, 1 - Math.pow(Math.abs(x) / a, 2.6)), 1 / 2.6);
  }

  function Lathe(tbl, y0, y1, rows, N, e, withFeat, seed) {
    var cnt = (rows + 1) * (N + 1), i, j, k;
    this.rows = rows; this.N = N; this.cnt = cnt;
    var F = function () { return new Float32Array(cnt); };
    this.lx = F(); this.ly = F(); this.lz = F(); this.nx = F(); this.ny = F(); this.nz = F();
    this.sx = F(); this.sy = F(); this.rz = F(); this.br = F(); this.nzr = F();
    for (i = 0; i <= rows; i++) {
      var y = y0 + (y1 - y0) * (i / rows);
      var a = prof(tbl, y, 1), b = prof(tbl, y, 2);
      for (j = 0; j <= N; j++) {
        var th = -Math.PI + 2 * Math.PI * (j / N);
        var sn = Math.sin(th), cs = Math.cos(th);
        var x = a * sgnPow(sn, 2 / e), z = b * sgnPow(cs, 2 / e);
        if (withFeat && cs > 0) { z += feat(x, y); }
        k = i * (N + 1) + j;
        this.lx[k] = x; this.ly[k] = y; this.lz[k] = z;
      }
    }
    for (i = 0; i <= rows; i++) {
      for (j = 0; j <= N; j++) {
        k = i * (N + 1) + j;
        var jm = (j === 0) ? N - 1 : j - 1, jp = (j === N) ? 1 : j + 1;
        var ia = Math.max(i - 1, 0), ib = Math.min(i + 1, rows);
        var k1 = i * (N + 1) + jp, k0 = i * (N + 1) + jm, k3 = ib * (N + 1) + j, k2 = ia * (N + 1) + j;
        var tx = this.lx[k1] - this.lx[k0], ty = this.ly[k1] - this.ly[k0], tz = this.lz[k1] - this.lz[k0];
        var ux = this.lx[k3] - this.lx[k2], uy = this.ly[k3] - this.ly[k2], uz = this.lz[k3] - this.lz[k2];
        var nx = ty * uz - tz * uy, ny = tz * ux - tx * uz, nz = tx * uy - ty * ux;
        var L = Math.sqrt(nx * nx + ny * ny + nz * nz);
        if (L < 1e-9) { nx = 0; ny = i === 0 ? -1 : 1; nz = 0; } else { nx /= L; ny /= L; nz /= L; }
        this.nx[k] = nx; this.ny[k] = ny; this.nz[k] = nz;
      }
    }
    this.mnx = new Float32Array(rows + 1); this.mny = new Float32Array(rows + 1);
    this.mxx = new Float32Array(rows + 1); this.mxy = new Float32Array(rows + 1);
    var r = rng(seed || 3);
    this.spark = [];
    for (k = 0; k < cnt; k++) { if (r() < 0.11) { this.spark.push(k); } }
  }

  var MAXSEG = 9000;
  var SEG = [0, 1, 2, 3].map(function () { return new Float32Array(MAXSEG * 4); });
  var SEGN = [0, 0, 0, 0];
  var A_GLOW = [0.05, 0.09, 0.14, 0.20];
  var A_CORE = [0.22, 0.42, 0.66, 0.92];

  var ROT = { cy: 1, sy: 0, cp: 1, sp: 0, px: 0, py: 0, pz: 0, tx: 0, ty: 0 };
  function setRot(R, yaw, pit, px, py, pz, tx, ty) {
    R.cy = Math.cos(yaw); R.sy = Math.sin(yaw); R.cp = Math.cos(pit); R.sp = Math.sin(pit);
    R.px = px; R.py = py; R.pz = pz; R.tx = tx; R.ty = ty;
  }
  var RH = {}, RN = {}, RB = {};

  function project(Lh, R) {
    var cy = R.cy, sy = R.sy, cp = R.cp, sp = R.sp;
    for (var k = 0; k < Lh.cnt; k++) {
      var x = Lh.lx[k] - R.px, y = Lh.ly[k] - R.py, z = Lh.lz[k] - R.pz;
      var x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
      var y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
      x1 += R.px + R.tx; y2 += R.py + R.ty; z2 += R.pz;
      var f = DC / (DC - z2);
      Lh.sx[k] = ox + x1 * f * u; Lh.sy[k] = oy + y2 * f * u; Lh.rz[k] = z2;
      var nx = Lh.nx[k], ny = Lh.ny[k], nz = Lh.nz[k];
      var n1x = nx * cy + nz * sy, n1z = -nx * sy + nz * cy;
      var n2y = ny * cp - n1z * sp, n2z = ny * sp + n1z * cp;
      Lh.nzr[k] = n2z;
      var I = n1x * LIGHT[0] + n2y * LIGHT[1] + n2z * LIGHT[2];
      if (I < 0) { I = 0; }
      var rim = 1 - Math.abs(n2z);
      Lh.br[k] = 0.16 + 0.50 * I + 0.62 * rim * rim;
    }
  }

  var HEADL = new Lathe(HEAD, -1.32, -0.455, 38, 84, 2, true, 3);
  var NECKL = new Lathe(NECK, -0.62, -0.30, 8, 48, 2, false, 4);
  var BODYL = new Lathe(BODY, -0.34, 0.95, 26, 72, 2.6, false, 5);

  function fadeOf(y, fadeBody) {
    if (!fadeBody) { return 1; }
    return 1 - ease((y - 0.28) / 0.55);
  }

  function drawLathe(Lh, fadeBody, mul, rowStep, merStep) {
    var rows = Lh.rows, N = Lh.N, i, j, k, b;
    // ---- silhouette
    for (i = 0; i <= rows; i++) {
      var mn = 1e9, mx = -1e9, kn = 0, kx = 0;
      for (j = 0; j < N; j++) {
        k = i * (N + 1) + j;
        if (Lh.sx[k] < mn) { mn = Lh.sx[k]; kn = k; }
        if (Lh.sx[k] > mx) { mx = Lh.sx[k]; kx = k; }
      }
      Lh.mnx[i] = Lh.sx[kn]; Lh.mny[i] = Lh.sy[kn];
      Lh.mxx[i] = Lh.sx[kx]; Lh.mxy[i] = Lh.sy[kx];
    }
    if (fadeBody) {
      var g = ctx.createLinearGradient(0, oy + 0.25 * u, 0, oy + 0.85 * u);
      g.addColorStop(0, DARKC); g.addColorStop(1, 'rgba(7,3,30,0)');
      ctx.fillStyle = g;
    } else { ctx.fillStyle = DARKC; }
    ctx.beginPath();
    ctx.moveTo(Lh.mnx[0], Lh.mny[0]);
    for (i = 1; i <= rows; i++) { ctx.lineTo(Lh.mnx[i], Lh.mny[i]); }
    for (i = rows; i >= 0; i--) { ctx.lineTo(Lh.mxx[i], Lh.mxy[i]); }
    ctx.closePath(); ctx.fill();

    // ---- contour lines (rows) and meridians, binned by brightness
    SEGN[0] = SEGN[1] = SEGN[2] = SEGN[3] = 0;
    var stride = N + 1;
    function push(k1, k2) {
      if (Lh.nzr[k1] < -0.02 || Lh.nzr[k2] < -0.02) { return; }
      var ff = fadeOf(Lh.ly[k1], fadeBody);
      if (ff < 0.04) { return; }
      var v = (Lh.br[k1] + Lh.br[k2]) * 0.5 * ff * mul;
      var bn = v < 0.30 ? 0 : (v < 0.50 ? 1 : (v < 0.72 ? 2 : 3));
      var n = SEGN[bn]; if (n >= MAXSEG) { return; }
      var a = SEG[bn], o = n * 4;
      a[o] = Lh.sx[k1]; a[o + 1] = Lh.sy[k1]; a[o + 2] = Lh.sx[k2]; a[o + 3] = Lh.sy[k2];
      SEGN[bn] = n + 1;
    }
    for (i = 0; i <= rows; i += rowStep) {
      for (j = 0; j < N; j++) { k = i * stride + j; push(k, k + 1); }
    }
    for (j = 0; j < N; j += merStep) {
      for (i = 0; i < rows; i++) { k = i * stride + j; push(k, k + stride); }
    }
    ctx.lineCap = 'round';
    for (b = 0; b < 4; b++) {
      if (!SEGN[b]) { continue; }
      var arr = SEG[b];
      ctx.beginPath();
      for (k = 0; k < SEGN[b]; k++) {
        ctx.moveTo(arr[k * 4], arr[k * 4 + 1]); ctx.lineTo(arr[k * 4 + 2], arr[k * 4 + 3]);
      }
      ctx.strokeStyle = rgba(tint, A_GLOW[b]); ctx.lineWidth = 3.4 * dpr; ctx.stroke();
      ctx.strokeStyle = coreColor(A_CORE[b]); ctx.lineWidth = (0.7 + 0.22 * b) * dpr; ctx.stroke();
    }

    // ---- rim light on the outline
    ctx.beginPath();
    ctx.moveTo(Lh.mnx[0], Lh.mny[0]);
    for (i = 1; i <= rows; i++) { ctx.lineTo(Lh.mnx[i], Lh.mny[i]); }
    ctx.moveTo(Lh.mxx[0], Lh.mxy[0]);
    for (i = 1; i <= rows; i++) { ctx.lineTo(Lh.mxx[i], Lh.mxy[i]); }
    ctx.strokeStyle = rgba(tint, 0.20); ctx.lineWidth = 6 * dpr; ctx.stroke();
    ctx.strokeStyle = coreColor(0.85); ctx.lineWidth = 1.6 * dpr; ctx.stroke();

    // ---- sparkles on the lit surface
    var tt = S.t;
    for (k = 0; k < Lh.spark.length; k++) {
      var q = Lh.spark[k];
      if (Lh.nzr[q] < 0.05) { continue; }
      var ff2 = fadeOf(Lh.ly[q], fadeBody);
      if (ff2 < 0.05) { continue; }
      var al = Lh.br[q] * ff2 * (0.55 + 0.45 * Math.sin(tt * 3 + q));
      ctx.fillStyle = coreColor(al);
      var sz = 1.5 * dpr;
      ctx.fillRect(Lh.sx[q] - sz / 2, Lh.sy[q] - sz / 2, sz, sz);
    }
  }

  // ---- hair: 3D strands that follow the skull and fall over the shoulders
  var HAIR_A = [[-1.32, 0], [-1.0, 0.33], [-0.8, 0.38], [-0.5, 0.39], [-0.3, 0.44], [0, 0.53], [0.3, 0.59], [0.65, 0.61]];
  var HAIR_B = [[-1.32, 0], [-1.0, 0.40], [-0.8, 0.40], [-0.5, 0.33], [-0.3, 0.29], [0, 0.27], [0.3, 0.26], [0.65, 0.26]];
  var HSTEPS = 26;
  var HAIR3 = (function () {
    var r = rng(11), out = [], side, i, j;
    for (side = -1; side <= 1; side += 2) {
      for (i = 0; i < 95; i++) {
        var t = i / 94;
        var phi0 = 1.15 + Math.pow(t, 0.8) * (Math.PI - 1.15 - 0.05) + r() * 0.05;
        var yEnd = 0.02 + 0.58 * Math.pow(r(), 0.8);
        var amp = 0.05 + r() * 0.13, fr = 4 + r() * 6, ph = r() * 6.28, off = r() * 0.045;
        var pts = new Float32Array((HSTEPS + 1) * 3);
        for (j = 0; j <= HSTEPS; j++) {
          var uu = j / HSTEPS;
          var y = -1.318 + (yEnd + 1.318) * Math.pow(uu, 0.9);
          var ah = Math.max(prof(HEAD, y, 1) * 1.07 + 0.012, prof(HAIR_A, y, 1)) + off;
          var bh = Math.max(prof(HEAD, y, 2) * 1.07 + 0.012, prof(HAIR_B, y, 1)) + off;
          var phi = phi0 + Math.sin(uu * fr + ph) * amp * Math.min(1, uu * 2.2);
          var x = side * ah * Math.sin(phi), z = bh * Math.cos(phi);
          if (y > -0.4 && z > 0) {
            var zb = bodyFront(x, y) + 0.025 + off;
            if (z < zb) { z = zb; }
          }
          pts[j * 3] = x; pts[j * 3 + 1] = y; pts[j * 3 + 2] = z;
        }
        out.push({ pts: pts, cls: r() < 0.22 ? 2 : (r() < 0.5 ? 1 : 0) });
      }
    }
    return out;
  })();
  var HSX = new Float32Array(HAIR3.length * (HSTEPS + 1));
  var HSY = new Float32Array(HAIR3.length * (HSTEPS + 1));
  var HRZ = new Float32Array(HAIR3.length * (HSTEPS + 1));

  function projectHair(R) {
    var cy = R.cy, sy = R.sy, cp = R.cp, sp = R.sp;
    for (var s = 0; s < HAIR3.length; s++) {
      var p = HAIR3[s].pts;
      for (var j = 0; j <= HSTEPS; j++) {
        var x = p[j * 3] - R.px, y = p[j * 3 + 1] - R.py, z = p[j * 3 + 2] - R.pz;
        var x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
        var y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
        x1 += R.px + R.tx; y2 += R.py + R.ty; z2 += R.pz;
        var f = DC / (DC - z2), q = s * (HSTEPS + 1) + j;
        HSX[q] = ox + x1 * f * u; HSY[q] = oy + y2 * f * u; HRZ[q] = z2;
      }
    }
  }

  function drawHair(front) {
    var hg = ctx.createLinearGradient(0, oy - 1.35 * u, 0, oy + 0.7 * u);
    hg.addColorStop(0, coreColor(0.95));
    hg.addColorStop(0.55, rgba(tint, 0.85));
    hg.addColorStop(1, rgba(tint, 0.22));
    var wd = [0.9, 1.2, 2.0], al = [0.6, 0.85, 1.0];
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (var cls = 0; cls < 3; cls++) {
      ctx.beginPath();
      for (var s = 0; s < HAIR3.length; s++) {
        if (HAIR3[s].cls !== cls) { continue; }
        var base = s * (HSTEPS + 1), pen = false;
        for (var j = 0; j < HSTEPS; j++) {
          var q = base + j, zz = (HRZ[q] + HRZ[q + 1]) * 0.5;
          var isFront = zz >= 0;
